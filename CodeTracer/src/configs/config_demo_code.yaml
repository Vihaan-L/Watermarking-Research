# Model arguments
model_name_or_path: Infly/OpenCoder-1.5B-Instruct
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: open-r1/verifiable-coding-problems-python
dataset_prompt_column: problem_statement

# GRPO trainer config
wandb_project: "watermark-rl"
beta: 0.0
bf16: true
use_vllm: false
do_eval: false
gradient_accumulation_steps: 4
gradient_checkpointing: false
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 1.0e-05
log_completions: true
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
max_prompt_length: 256
max_completion_length: 1024
max_steps: 500
num_generations: 8
num_train_epochs: 1
output_dir: outputs/OpenCoder-1.5B-Instruct-GRPO
overwrite_output_dir: true
per_device_train_batch_size: 8
push_to_hub: false
report_to:
- wandb
reward_funcs:
- watermark
- code
reward_weights:
- 1.0
- 1.0
save_strategy: "steps"
save_steps: 50
# save_total_limit: 1
seed: 42
temperature: 1.0
warmup_ratio: 0.03

# Watermark parameters
watermark_context_width: 2
watermark_gamma: 0.5
watermark_z_threshold: 4.0
watermark_switch_threshold: 0.5

code_ckpt_path: false
